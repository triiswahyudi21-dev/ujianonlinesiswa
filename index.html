<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UJIAN ONLINE SISWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SDK Firebase CDN (v9 Compatibility Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { user-select: none; -webkit-user-select: none; }
    .rich-editor img, #display-teks-soal img, .opt-display img {
      max-width: 100% !important; 
      height: auto !important; 
      max-height: 300px !important; 
      border-radius: 0.375rem; 
      margin: 10px 0 !important; 
      display: block !important;
    }
    .anbk-header { background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 100%); }
    .anbk-card { border-top: 5px solid #2563eb; }

    .soal-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      width: 100%;
    }
    .soal-number {
      flex-shrink: 0;
      min-width: 28px;
      font-weight: 700;
      font-size: 1rem;
      color: #1e293b;
      line-height: 1.6;
      text-align: right;
    }
    .soal-content {
      flex: 1 1 0%;
      min-width: 0;
      text-align: justify;
      text-justify: inter-word;
      word-break: break-word;
      font-size: 1rem;
      color: #1e293b;
      font-weight: 500;
      line-height: 1.6;
    }
    .soal-content * {
      margin-top: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      padding: 0 !important;
      text-indent: 0 !important;
      line-height: 1.6 !important;
      text-align: justify !important;
    }
    .soal-content p { margin-bottom: 0.25rem !important; }
    .soal-content p:last-child { margin-bottom: 0 !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 bg-red-600 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm font-semibold"></div>

  <!-- MODAL KONFIRMASI LOGOUT / KELUAR -->
  <div id="modal-logout" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl border border-slate-200">
      <h3 class="text-lg font-bold text-slate-900">Konfirmasi Keluar Ujian</h3>
      <p class="text-xs text-slate-600">Apakah Anda yakin ingin keluar dari layar ujian?</p>
      <div class="flex gap-2">
        <button onclick="prosesLogout(true)" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-xl text-xs transition">Ya, Keluar</button>
        <button onclick="prosesLogout(false)" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-xs transition">Batal</button>
      </div>
    </div>
  </div>

  <!-- HALAMAN LOGIN SISWA -->
  <div id="page-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-blue-900 tracking-wider uppercase">UJIAN ONLINE SISWA</h1>
        <p class="text-xs text-slate-500 font-medium mt-1">Sistem Ujian Sekolah & Evaluasi Terintegrasi</p>
      </div>

      <form id="form-login-siswa" onsubmit="handleLoginSiswa(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kelas / Rombel</label>
          <select id="siswa-kelas" onchange="updateSiswaDropdown()" class="w-full p-2.5 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Siswa</label>
          <select id="siswa-nama" class="w-full p-2.5 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="">-- Pilih Nama --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode Ujian (Token)</label>
          <input type="text" id="siswa-token" placeholder="Token Ujian" class="w-full p-2.5 bg-slate-50 border rounded-lg uppercase font-mono font-bold tracking-widest focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">MASUK & MULAI UJIAN</button>
      </form>
    </div>
  </div>

  <!-- HALAMAN KERJA UJIAN SISWA -->
  <div id="page-siswa" class="hidden min-h-screen bg-slate-100 flex flex-col justify-between select-none">
    <div class="anbk-header text-white px-6 py-3 shadow-md flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <div class="bg-white/10 p-2 rounded-lg font-black text-xs tracking-wider border border-white/20 uppercase">UJIAN ONLINE SISWA</div>
        <div>
          <h2 id="view-siswa-nama" class="font-bold text-sm md:text-base leading-tight">Nama Siswa</h2>
          <p id="view-siswa-info" class="text-xs text-blue-200">UH | Mapel | Ganjil TP. 2025/2026</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="bg-blue-950/80 border border-blue-400/30 px-4 py-1.5 rounded-xl text-right">
          <p class="text-[9px] text-blue-300 uppercase font-bold tracking-widest">Sisa Waktu</p>
          <p id="timer-display" class="font-mono text-lg font-black text-yellow-300">00:00</p>
        </div>
        <button onclick="mintaLogout()" class="bg-red-500 hover:bg-red-600 text-white font-bold text-xs px-3 py-2 rounded-lg shadow transition">LOGOUT</button>
      </div>
    </div>

    <!-- MAIN CONTENT: GRID LAYOUT UNTUK SOAL (KIRI) DAN NAVIGASI (KANAN) -->
    <div class="p-4 md:p-6 max-w-7xl mx-auto w-full flex-grow">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-5 items-start">
        
        <!-- KOLOM KIRI: AREA SOAL UJIAN -->
        <div class="lg:col-span-3 bg-white rounded-xl shadow-md border border-slate-200 anbk-card p-5 md:p-6 space-y-4">
          <div class="flex justify-between items-center border-b pb-3">
            <div class="flex items-center gap-2">
              <span class="bg-blue-600 text-white font-black text-sm px-3.5 py-1.5 rounded-md shadow-sm">SOAL NO. <span id="soal-nomor-display">1</span></span>
              <span id="display-hots-lots" class="text-xs font-extrabold px-2.5 py-1 rounded-md border"></span>
            </div>
            <span id="display-jenis-ujian" class="text-xs font-extrabold text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1 rounded-md">UH</span>
          </div>

          <div class="soal-wrapper">
            <div id="display-soal-num-prefix" class="soal-number">1.</div>
            <div id="display-teks-soal" class="soal-content"></div>
          </div>

          <div class="space-y-2.5 pt-3 border-t border-slate-200" id="options-container"></div>
        </div>

        <!-- KOLOM KANAN: PAPAN NAVIGASI NOMOR SOAL -->
        <div class="lg:col-span-1 bg-white rounded-xl shadow-md border border-slate-200 p-4 space-y-3 sticky top-20">
          <div class="border-b pb-2 flex justify-between items-center">
            <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Navigasi Soal</h3>
            <span id="nav-counter" class="text-[11px] font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200">0/0</span>
          </div>

          <!-- Keterangan Status Warna -->
          <div class="grid grid-cols-3 gap-1 text-[10px] font-semibold text-slate-600 border-b pb-2">
            <div class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded bg-emerald-600 inline-block"></span> Dijawab
            </div>
            <div class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded bg-amber-400 inline-block"></span> Ragu
            </div>
            <div class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded bg-slate-100 border border-slate-300 inline-block"></span> Belum
            </div>
          </div>

          <!-- Container Grid Nomor Soal -->
          <div id="nav-soal-grid" class="grid grid-cols-5 gap-2 max-h-[380px] overflow-y-auto pr-1">
            <!-- Tombol nomor soal di-render dinamis dari JavaScript -->
          </div>
        </div>

      </div>
    </div>

    <!-- BOTTOM BAR: BUTTONS NAVIGASI -->
    <div class="bg-white border-t border-slate-300 px-6 py-3 shadow-lg max-w-7xl mx-auto w-full flex justify-between items-center sticky bottom-0 rounded-t-xl z-10">
      <button id="btn-prev" onclick="navSoal(-1)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg text-sm shadow transition">SOAL SEBELUMNYA</button>
      
      <label class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-semibold px-3 py-1.5 rounded-lg text-xs cursor-pointer shadow transition border border-yellow-500/30 select-none">
        <input type="checkbox" id="chk-ragu" onchange="toggleRagu()" class="w-3.5 h-3.5 accent-slate-900 rounded cursor-pointer">
        <span class="tracking-wide">RAGU - RAGU</span>
      </label>

      <button id="btn-next" onclick="navSoal(1)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg text-sm shadow transition">SOAL BERIKUTNYA</button>
      <button id="btn-submit" onclick="konfirmasiSelesai()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-black px-7 py-2 rounded-lg text-sm shadow transition">SELESAI UJIAN</button>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // KONFIGURASI FIREBASE
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBxQCgLQlLPkueDp0lpuLarGwWWLIpEwnM",
      authDomain: "ujianonline-937d4.firebaseapp.com",
      databaseURL: "https://ujianonline-937d4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ujianonline-937d4",
      storageBucket: "ujianonline-937d4.firebasestorage.app",
      messagingSenderId: "615101746896",
      appId: "1:615101746896:web:7d0da7dd7106de4fabd8d5",
      measurementId: "G-9DL8C937J8"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let appData = {
      token: 'EXAM88',
      soal: [],
      siswa: [],
      config: {}
    };

    let stateUjianSiswa = {
      currentSiswaKey: null,
      currentSoalIdx: 0,
      jawaban: {},
      ragu: {},
      timerInterval: null,
      waktuSisa: 0,
      isExamActive: false
    };

    window.onload = function() {
      // Prevent Context Menu
      document.addEventListener('contextmenu', e => e.preventDefault());

      // Blokir tombol ESC / Pintasan Keyboard tertentu saat ujian aktif
      document.addEventListener('keydown', e => {
        if (stateUjianSiswa.isExamActive) {
          if (e.key === 'Escape' || e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C'))) {
            e.preventDefault();
          }
        }
      });

      // Sinkronisasi Data Realtime dari Firebase
      db.ref('token').on('value', snap => { appData.token = snap.val() || 'EXAM88'; });
      db.ref('soal').on('value', snap => { appData.soal = snap.val() ? Object.values(snap.val()) : []; });
      
      db.ref('config').on('value', snap => { 
        appData.config = snap.val() || {}; 
        populateSiswaClasses();
      });
      
      db.ref('siswa').on('value', snap => {
        const data = snap.val();
        appData.siswa = [];
        if(data) {
          Object.keys(data).forEach(key => {
            appData.siswa.push({ key: key, ...data[key] });
          });
        }
        populateSiswaClasses();
      });
    };

    // FULLSCREEN HANDLER
    function openFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    function exitFullscreenSafely() {
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }

    // FUNGSI LOGOUT DENGAN KONFIRMASI
    function mintaLogout() {
      document.getElementById('modal-logout').classList.remove('hidden');
    }

    function prosesLogout(setuju) {
      document.getElementById('modal-logout').classList.add('hidden');
      if (setuju) {
        stateUjianSiswa.isExamActive = false;
        clearInterval(stateUjianSiswa.timerInterval);

        if (stateUjianSiswa.currentSiswaKey) {
          db.ref('siswa/' + stateUjianSiswa.currentSiswaKey).update({ status: 'Selesai / Keluar' });
        }

        exitFullscreenSafely();
        document.getElementById('page-siswa').classList.add('hidden');
        document.getElementById('page-login').classList.remove('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function cleanWordFormatting(html) {
      if (!html) return '';
      let temp = document.createElement('div');
      temp.innerHTML = html;
      temp.querySelectorAll('[style*="mso-list"], [class*="MsoList"], o\\:p').forEach(el => el.remove());
      temp.querySelectorAll('*').forEach(el => {
        if (el.tagName.toLowerCase() !== 'img') {
          el.removeAttribute('style');
          el.removeAttribute('class');
          el.removeAttribute('align');
        }
      });
      return temp.innerHTML.trim();
    }

    function sanitizeOptionText(rawHtml) {
      if (!rawHtml) return '';
      let cleanedHtml = cleanWordFormatting(rawHtml);
      let temp = document.createElement('div');
      temp.innerHTML = cleanedHtml;
      let textNodes = [];
      let walk = document.createTreeWalker(temp, NodeFilter.SHOW_TEXT, null, false);
      let n;
      while(n = walk.nextNode()) textNodes.push(n);
      if (textNodes.length > 0) {
        textNodes[0].nodeValue = textNodes[0].nodeValue.replace(/^(\s*(\[[a-dA-D]\]|[a-dA-D][\.\)\-–]))\s*/gi, '');
      }
      return temp.innerHTML.trim();
    }

    function sanitizeSoalText(rawHtml) {
      if (!rawHtml) return '';
      let cleanedHtml = cleanWordFormatting(rawHtml);
      let temp = document.createElement('div');
      temp.innerHTML = cleanedHtml;
      let textNodes = [];
      let walk = document.createTreeWalker(temp, NodeFilter.SHOW_TEXT, null, false);
      let n;
      while(n = walk.nextNode()) textNodes.push(n);
      if (textNodes.length > 0) {
        textNodes[0].nodeValue = textNodes[0].nodeValue
          .replace(/^(\s*(Soal\s*)?[0-9]+[\.\)\-–\:]+)\s*/gi, '')
          .trim();
      }
      return temp.innerHTML.trim();
    }

    function detectHotsOrLots(htmlContent) {
      const plainText = (htmlContent || '').replace(/<[^>]*>?/gm, '').toLowerCase();
      const hasImage = /<img\b[^>]*>/i.test(htmlContent || '');
      
      const hotsKeywords = [
        'analisis', 'menganalisis', 'bandingkan', 'membandingkan', 'evaluasi', 'mengevaluasi',
        'mengapa', 'bagaimana', 'jelaskan', 'gambarkan', 'diagram', 'grafik', 'tabel', 
        'stimulus', 'prediksi', 'kesimpulan', 'simpulan', 'hubungan', 'pengaruh', 'sebab', 'akibat', 'solusi'
      ];

      const isHots = hasImage || hotsKeywords.some(kw => plainText.includes(kw)) || plainText.length > 160;

      const badge = document.getElementById('display-hots-lots');
      if (isHots) {
        badge.innerText = 'Kategori Soal: HOTS';
        badge.className = 'text-xs font-extrabold px-2.5 py-1 rounded-md border border-purple-300 bg-purple-50 text-purple-700';
      } else {
        badge.innerText = 'Kategori Soal: LOTS';
        badge.className = 'text-xs font-extrabold px-2.5 py-1 rounded-md border border-teal-300 bg-teal-50 text-teal-700';
      }
    }

    function populateSiswaClasses() {
      const selectKelas = document.getElementById('siswa-kelas');
      if(!selectKelas) return;
      
      const valBefore = selectKelas.value;
      selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';

      let availableClasses = [...new Set(appData.siswa.map(s => s.kelas))];

      if (appData.config && appData.config.kelasAktif) {
        availableClasses = availableClasses.filter(c => c === appData.config.kelasAktif);
      }

      availableClasses.sort().forEach(c => { 
        selectKelas.innerHTML += `<option value="${c}">${c}</option>`; 
      });

      if(valBefore && availableClasses.includes(valBefore)) {
        selectKelas.value = valBefore;
      }

      updateSiswaDropdown();
    }

    function updateSiswaDropdown() {
      const kls = document.getElementById('siswa-kelas').value;
      const selectNama = document.getElementById('siswa-nama');
      if(!selectNama) return;
      
      const valBefore = selectNama.value;
      selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
      appData.siswa.filter(s => s.kelas === kls).forEach(s => {
        selectNama.innerHTML += `<option value="${s.nama}">${s.nama}</option>`;
      });
      if(valBefore) selectNama.value = valBefore;
    }

    function handleLoginSiswa(e) {
      e.preventDefault();
      const nama = document.getElementById('siswa-nama').value;
      const kelas = document.getElementById('siswa-kelas').value;
      const token = document.getElementById('siswa-token').value.toUpperCase();

      if (!nama || !kelas) return showToast("Lengkapi data login!");
      if (token !== appData.token) return showToast("Token Ujian Salah!");
      if (appData.soal.length === 0) return showToast("Belum ada soal tersedia!");

      const sObj = appData.siswa.find(s => s.nama === nama && s.kelas === kelas);
      if (sObj && sObj.mekerjakan) return alert("Anda sudah menyelesaikan ujian ini!");

      stateUjianSiswa.currentSiswaKey = sObj ? sObj.key : null;
      stateUjianSiswa.isExamActive = true;

      openFullscreen();

      if(stateUjianSiswa.currentSiswaKey) {
        db.ref('siswa/' + stateUjianSiswa.currentSiswaKey).update({ status: 'Sedang Ujian' });
      }

      document.getElementById('page-login').classList.add('hidden');
      document.getElementById('page-siswa').classList.remove('hidden');

      const jenisUjian = appData.config.jenis || 'UH';
      const mapel = appData.config.mapel || 'Mapel';
      const semester = appData.config.semester || 'Ganjil';
      const tp = appData.config.tp || '2025/2026';

      document.getElementById('view-siswa-nama').innerText = nama;
      document.getElementById('view-siswa-info').innerText = `${jenisUjian} | ${mapel} | ${semester} TP. ${tp}`;
      document.getElementById('display-jenis-ujian').innerText = jenisUjian;

      stateUjianSiswa.waktuSisa = parseInt(appData.config.waktu || '60') * 60;
      startTimer();
      renderSoalSiswa(0);
    }

    function startTimer() {
      stateUjianSiswa.timerInterval = setInterval(() => {
        stateUjianSiswa.waktuSisa--;
        const m = Math.floor(stateUjianSiswa.waktuSisa / 60);
        const s = stateUjianSiswa.waktuSisa % 60;
        document.getElementById('timer-display').innerText = 
          `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (stateUjianSiswa.waktuSisa <= 0) {
          clearInterval(stateUjianSiswa.timerInterval);
          submitUjian();
        }
      }, 1000);
    }

    // FUNGSI UNTUK MERENDER PAPAN NAVIGASI NOMOR SOAL DI SEBELAH KANAN
    function renderNavGrid() {
      const grid = document.getElementById('nav-soal-grid');
      const counter = document.getElementById('nav-counter');
      if (!grid) return;

      grid.innerHTML = '';
      let dijawabCount = 0;

      appData.soal.forEach((s, idx) => {
        const isCurrent = idx === stateUjianSiswa.currentSoalIdx;
        const isAnswered = stateUjianSiswa.jawaban[idx] !== undefined && stateUjianSiswa.jawaban[idx] !== '';
        const isRagu = !!stateUjianSiswa.ragu[idx];

        if (isAnswered) dijawabCount++;

        let btnClass = "bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-300";

        if (isRagu) {
          btnClass = "bg-amber-400 text-slate-900 border-amber-500 font-bold shadow-sm";
        } else if (isAnswered) {
          btnClass = "bg-emerald-600 text-white border-emerald-700 font-bold shadow-sm";
        }

        if (isCurrent) {
          btnClass += " ring-2 ring-blue-600 ring-offset-1";
        }

        grid.innerHTML += `
          <button onclick="renderSoalSiswa(${idx})" class="h-9 w-full rounded-lg border flex items-center justify-center text-xs font-bold transition transform active:scale-95 ${btnClass}">
            ${s.nomor || (idx + 1)}
          </button>
        `;
      });

      if (counter) {
        counter.innerText = `${dijawabCount}/${appData.soal.length}`;
      }
    }

    function renderSoalSiswa(index) {
      stateUjianSiswa.currentSoalIdx = index;
      const soal = appData.soal[index];
      const total = appData.soal.length;

      document.getElementById('soal-nomor-display').innerText = soal.nomor || (index + 1);
      document.getElementById('display-soal-num-prefix').innerText = (soal.nomor || (index + 1)) + '.';

      const sanitizedText = sanitizeSoalText(soal.teks);
      document.getElementById('display-teks-soal').innerHTML = sanitizedText;
      
      detectHotsOrLots(sanitizedText);

      document.getElementById('chk-ragu').checked = !!stateUjianSiswa.ragu[index];

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      const keys = Object.keys(soal.opts).sort();
      keys.forEach(opt => {
        const isSelected = stateUjianSiswa.jawaban[index] === opt;
        let cleanContent = sanitizeOptionText(soal.opts[opt]);

        optionsContainer.innerHTML += `
          <button onclick="pilihJawaban('${opt}')" class="w-full text-left px-3 py-2.5 rounded-xl border flex items-center gap-3 transition ${isSelected ? 'border-blue-600 bg-blue-50/80 shadow-sm ring-1 ring-blue-500' : 'border-slate-200 bg-slate-50 hover:border-slate-300 hover:bg-slate-100'}">
            <span class="w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-lg font-bold text-xs transition ${isSelected ? 'bg-blue-600 text-white shadow' : 'bg-white text-slate-700 border border-slate-300'}">${opt}</span>
            <div class="text-sm font-medium opt-display flex-grow text-slate-800 leading-snug" style="text-align: justify; text-justify: inter-word;">${cleanContent}</div>
          </button>
        `;
      });

      document.getElementById('btn-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
      if (index === total - 1) {
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-submit').classList.remove('hidden');
      } else {
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
      }

      renderNavGrid();
    }

    function pilihJawaban(opt) {
      stateUjianSiswa.jawaban[stateUjianSiswa.currentSoalIdx] = opt;
      renderSoalSiswa(stateUjianSiswa.currentSoalIdx);
    }

    function toggleRagu() {
      const idx = stateUjianSiswa.currentSoalIdx;
      stateUjianSiswa.ragu[idx] = document.getElementById('chk-ragu').checked;
      renderNavGrid();
    }

    function navSoal(step) {
      const target = stateUjianSiswa.currentSoalIdx + step;
      if (target >= 0 && target < appData.soal.length) {
        renderSoalSiswa(target);
      }
    }

    function konfirmasiSelesai() {
      if (confirm("Apakah Anda yakin ingin menyelesaikan ujian ini?")) submitUjian();
    }

    function submitUjian() {
      stateUjianSiswa.isExamActive = false;
      clearInterval(stateUjianSiswa.timerInterval);
      
      let benar = 0;
      appData.soal.forEach((s, i) => {
        if (stateUjianSiswa.jawaban[i] === s.kunci) benar++;
      });

      const nilaiAkhir = Math.round((benar / appData.soal.length) * 100);

      if(stateUjianSiswa.currentSiswaKey) {
        db.ref('siswa/' + stateUjianSiswa.currentSiswaKey).update({
          nilai: nilaiAkhir,
          status: 'Selesai',
          mekerjakan: true
        });
      }

      alert(`Ujian Berhasil Diselesaikan!\nNilai Ujian Anda: ${nilaiAkhir}`);
      exitFullscreenSafely();

      document.getElementById('page-siswa').classList.add('hidden');
      document.getElementById('page-login').classList.remove('hidden');
    }
  </script>
</body>
</html>
